<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ahmad Hassan | Full Stack Developer</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Premium portfolio for Ahmad Hassan, a full stack developer focused on Angular, Node.js, AI-powered products, and polished web experiences."
  >
  <meta name="theme-color" content="#f4f1ea">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'dark' || stored === 'light' ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var bg = theme === 'dark' ? '#030403' : '#f4f1ea';
        document.documentElement.style.backgroundColor = bg;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"
  >
</head>
<body>

</body>
</html>
